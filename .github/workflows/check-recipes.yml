name: check-recipes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recipe integrity (compile, call-shape, paths, model ids, cost, sidecars)
        run: python scripts/check_recipes.py
      - name: Reference-containment unit tests
        run: python -m unittest discover -s tests -v
